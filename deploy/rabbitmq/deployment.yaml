apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: mtv-erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          envFrom:
            - secretRef:
                name: rabbitmq-credentials
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
