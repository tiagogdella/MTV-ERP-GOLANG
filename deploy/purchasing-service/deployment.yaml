apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchasing-service
  namespace: mtv-erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purchasing-service
  template:
    metadata:
      labels:
        app: purchasing-service
    spec:
      containers:
        - name: purchasing-service
          image: ghcr.io/tiagogdella/purchasing-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: purchasing-service-config
            - secretRef:
                name: purchasing-service-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-secret

