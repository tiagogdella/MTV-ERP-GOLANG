# ⚠️ MOLDE de exemplo — nunca commite este Secret com valores reais preenchidos.
# O Secret de verdade se cria direto no cluster, fora do git:
#
#   PGPASS=$(kubectl get secret purchasing-db-credentials -n mtv-erp \
#     -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
#   kubectl create secret generic purchasing-service-secret -n mtv-erp \
#     --from-literal=DATABASE_URL="postgres://purchasing_service:${PGPASS}@purchasing-db:5432/purchasing?sslmode=disable"
#
# Chave esperada pelo Deployment (envFrom > secretRef):
#   DATABASE_URL - DSN do Postgres; host = "purchasing-db" (nome do Service no cluster)
apiVersion: v1
kind: Secret
metadata:
  name: purchasing-service-secret
  namespace: mtv-erp
type: Opaque
stringData:
  DATABASE_URL: "postgres://purchasing_service:SENHA@purchasing-db:5432/purchasing?sslmode=disable"
