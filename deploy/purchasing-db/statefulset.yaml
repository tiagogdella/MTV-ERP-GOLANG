apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: purchasing-db
  namespace: mtv-erp
spec:
  serviceName: purchasing-db
  replicas: 1
  selector:
    matchLabels:
      app: purchasing-db
  template:
    metadata:
      labels:
        app: purchasing-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: purchasing-db-credentials
          volumeMounts:
            - name: purchasing-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: purchasing-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
