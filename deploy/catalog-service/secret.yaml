# ⚠️ MOLDE de exemplo — nunca commite este Secret com valores reais preenchidos.
# O Secret de verdade se cria direto no cluster, fora do git:
#
#   PGPASS=$(kubectl get secret catalog-db-credentials -n mtv-erp \
#     -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
#   kubectl create secret generic catalog-service-secret -n mtv-erp \
#     --from-literal=DATABASE_URL="postgres://catalog_service:${PGPASS}@catalog-db:5432/catalog?sslmode=disable"
#
# Chave esperada pelo Deployment (envFrom > secretRef):
#   DATABASE_URL - DSN do Postgres; host = "catalog-db" (nome do Service no cluster)
apiVersion: v1
kind: Secret
metadata:
  name: catalog-service-secret
  namespace: mtv-erp
type: Opaque
stringData:
  DATABASE_URL: "postgres://catalog_service:SENHA@catalog-db:5432/catalog?sslmode=disable"
