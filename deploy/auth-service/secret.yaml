# ⚠️ MOLDE de exemplo — nunca commite este Secret com valores reais preenchidos.
# O Secret de verdade se cria direto no cluster, fora do git:
#
#   JWT=$(openssl rand -base64 32)
#   PGPASS=$(kubectl get secret auth-db-credentials -n mtv-erp \
#     -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
#   kubectl create secret generic auth-service-secret -n mtv-erp \
#     --from-literal=JWT_SECRET="$JWT" \
#     --from-literal=DATABASE_URL="postgres://auth_service:${PGPASS}@auth-db:5432/auth?sslmode=disable"
#
# Chaves esperadas pelo Deployment (envFrom > secretRef):
#   JWT_SECRET   - segredo pra assinar/validar os JWT (HS256)
#   DATABASE_URL - DSN do Postgres; host = "auth-db" (nome do Service no cluster)
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: mtv-erp
type: Opaque
stringData:
  JWT_SECRET: "troque-fora-do-git"
  DATABASE_URL: "postgres://auth_service:SENHA@auth-db:5432/auth?sslmode=disable"
