# ⚠️ MOLDE de exemplo — nunca commite este Secret com valores reais preenchidos.
# O Secret de verdade se cria direto no cluster, fora do git:
#
#   PGPASS=$(kubectl get secret inventory-db-credentials -n mtv-erp \
#     -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
#   kubectl create secret generic inventory-service-secret -n mtv-erp \
#     --from-literal=DATABASE_URL="postgres://inventory_service:${PGPASS}@inventory-db:5432/inventory?sslmode=disable"
#
# Chave esperada pelo Deployment (envFrom > secretRef):
#   DATABASE_URL - DSN do Postgres; host = "inventory-db" (nome do Service no cluster)
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-secret
  namespace: mtv-erp
type: Opaque
stringData:
  DATABASE_URL: "postgres://inventory_service:SENHA@inventory-db:5432/inventory?sslmode=disable"
