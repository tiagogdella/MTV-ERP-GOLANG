# ⚠️ Isso é um MOLDE de exemplo — nunca commite um Secret com valor real
# preenchido aqui. Segredo de verdade se aplica direto no cluster
# (kubectl create secret, fora do git) ou por uma ferramenta própria
# pra isso — não por arquivo commitado.
apiVersion: v1
kind: Secret
metadata:
  name: service-template-secret
  namespace: mtv-erp
type: Opaque
stringData:
  EXAMPLE_KEY: "troque-por-um-valor-de-verdade-fora-do-git"
