apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: mtv-erp
spec:
  ingressClassName: traefik
  rules:
    - host: app.192.168.1.44.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
